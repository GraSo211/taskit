services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskit
      POSTGRES_PASSWORD: taskit
      POSTGRES_DB: taskit
    ports:
      - "5434:5432"
    volumes:
      - taskit-postgres-data:/var/lib/postgresql/data

volumes:
  taskit-postgres-data:
